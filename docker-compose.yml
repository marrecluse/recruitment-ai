version: '3.9'

services:
  mongodb:
    image: mongo:7
    container_name: recruitment_mongo
    ports:
      - '27017:27017'
    volumes:
      - mongo_data:/data/db
    environment:
      MONGO_INITDB_DATABASE: recruitment_ai

  redis:
    image: redis:7-alpine
    container_name: recruitment_redis
    ports:
      - '6379:6379'

  backend:
    build: ./backend
    container_name: recruitment_backend
    ports:
      - '5000:5000'
    environment:
      - MONGO_URI=mongodb://mongodb:27017/recruitment_ai
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=supersecretkey_change_in_prod
      - JWT_REFRESH_SECRET=refreshsecret_change_in_prod
      - NLP_PARSER_URL=http://nlp-parser:8001
      - NLP_MATCHER_URL=http://nlp-matcher:8002
      - PORT=5000
    depends_on:
      - mongodb
      - redis
    volumes:
      - ./backend:/app
      - /app/node_modules

  nlp-parser:
    build: ./nlp-parser
    container_name: recruitment_parser
    ports:
      - '8001:8001'
    volumes:
      - ./nlp-parser:/app

  nlp-matcher:
    build: ./nlp-matcher
    container_name: recruitment_matcher
    ports:
      - '8002:8002'
    volumes:
      - ./nlp-matcher:/app

  frontend:
    build: ./frontend
    container_name: recruitment_frontend
    ports:
      - '3000:3000'
    environment:
      - VITE_API_URL=http://localhost:5000/api
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules

volumes:
  mongo_data:
